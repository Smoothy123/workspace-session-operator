name: Tests

on:
  push:
  pull_request:

permissions: {}

jobs:
  test:
    permissions:
      contents: read
    name: Run on Ubuntu
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod

      - name: Running Tests
        run: |
          go mod tidy
          make test

      - name: Verify generated code and formatting are up to date
        # `make test` runs manifests, generate, fmt and vet as prerequisites.
        # Those targets REWRITE files rather than failing, so without this check
        # stale deepcopy code, a stale CRD, or unformatted source would sail
        # through CI and only surface as confusing drift between the Go types
        # and the installed CRD.
        run: |
          if ! git diff --exit-code; then
            echo "::error::Generated code or formatting is stale. Run 'make manifests generate fmt' and commit the result."
            exit 1
          fi

      - name: Build manager binary
        run: make build
