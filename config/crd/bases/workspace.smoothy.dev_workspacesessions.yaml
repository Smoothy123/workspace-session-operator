metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: workspacesessions.workspace.smoothy.dev
spec:
  group: workspace.smoothy.dev
  names:
    kind: WorkspaceSession
    listKind: WorkspaceSessionList
    plural: workspacesessions
    shortNames:
    - ws
    singular: workspacesession
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.endpoint
      name: Endpoint
      type: string
    - jsonPath: .status.expiresAt
      name: Expires
      type: string
    - jsonPath: .status.extensionsUsed
      name: Ext
      type: integer
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          WorkspaceSession is an ephemeral developer workspace with a self-enforcing
          lifetime.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: WorkspaceSessionSpec defines the desired lifetime policy
              of a workspace.
            properties:
              extensionDuration:
                default: 30m
                description: ExtensionDuration is the additional lifetime granted
                  by each extension.
                type: string
              hardTTL:
                default: 4h
                description: |-
                  HardTTL is the absolute lifetime ceiling measured from creationTimestamp.
                  No extension can carry a session past it.
                type: string
              idleTimeout:
                default: 30m
                description: |-
                  IdleTimeout is how long a session may go without activity before it
                  becomes eligible to expire.
                type: string
              image:
                description: Image is the container image backing the workspace.
                minLength: 1
                type: string
              maxExtensions:
                default: 3
                description: |-
                  MaxExtensions caps how many times a session may be extended. Zero means
                  the session expires at its first idle check and is never extended.
                format: int32
                minimum: 0
                type: integer
              port:
                default: 8080
                description: Port is the port the workspace container listens on.
                format: int32
                maximum: 65535
                minimum: 1
                type: integer
            required:
            - image
            type: object
          status:
            description: WorkspaceSessionStatus reports observed lifecycle state.
            properties:
              conditions:
                description: Conditions holds Ready and Expired.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              endpoint:
                description: Endpoint is the in-cluster address of the workspace Service.
                type: string
              expiresAt:
                description: |-
                  ExpiresAt is when the controller will next wake and decide this session's
                  fate. It is always clamped to creationTimestamp + hardTTL.
                format: date-time
                type: string
              extensionsUsed:
                description: |-
                  ExtensionsUsed counts extensions granted so far. Establishing the initial
                  expiry window does not count as an extension.
                format: int32
                type: integer
              lastActivityAt:
                description: |-
                  LastActivityAt mirrors the most recent valid activity annotation. It only
                  ever moves forward.
                format: date-time
                type: string
              phase:
                description: Phase is a coarse summary of lifecycle state.
                enum:
                - Pending
                - Running
                - Expired
                - Terminating
                type: string
            type: object
        type: object
