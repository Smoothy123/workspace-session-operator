# This rule is not used by the project workspace-session-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the workspace.smoothy.dev.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: workspace-session-operator
    app.kubernetes.io/managed-by: kustomize
  name: workspacesession-editor-role
rules:
- apiGroups:
  - workspace.smoothy.dev
  resources:
  - workspacesessions
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - workspace.smoothy.dev
  resources:
  - workspacesessions/status
  verbs:
  - get
